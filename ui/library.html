<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<!-- Riunioni: Atticus.swift (MeetingLibrary) calls lib.list/meeting/answer/... and gets {do:'list'|'get'|'ask'|...} back. -->
<style>
  :root {
    --fg: #1d1d1f; --fg2: #6e6e73; --fg3: #86868b; --card: #fff; --ctl: #fff; --line: rgba(0,0,0,.08); --sel: rgba(0,0,0,.06);
    --side: rgba(255,255,255,.28); --accent: #0a84ff; --danger: #d70015; color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) { :root {
    --fg: #f5f5f7; --fg2: #a1a1a6; --fg3: #8e8e93; --card: #2a2a2c; --ctl: rgba(255,255,255,.1); --line: rgba(255,255,255,.08); --sel: rgba(255,255,255,.08);
    --side: rgba(0,0,0,.12); --danger: #ff453a;
  } }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 13px -apple-system, system-ui, sans-serif; color: var(--fg); -webkit-font-smoothing: antialiased; cursor: default; -webkit-user-select: none; }
  body { display: flex; }
  aside { width: 300px; flex: none; display: flex; flex-direction: column; background: var(--side); box-shadow: inset -.5px 0 0 var(--line); padding: 40px 12px 12px; box-sizing: border-box; }
  aside h1 { font-size: 20px; margin: 0 4px 10px; }
  input, textarea { font: 13px system-ui; color: var(--fg); background: var(--ctl); border: 0; border-radius: 8px; box-shadow: inset 0 0 0 .5px var(--line); outline: none; -webkit-user-select: text; }
  input:focus, textarea:focus { box-shadow: inset 0 0 0 .5px var(--line), 0 0 0 3px rgba(10,132,255,.35); }
  #q { height: 30px; padding: 0 10px; box-sizing: border-box; width: 100%; }
  #count { margin: 10px 4px 6px; font-size: 11px; color: var(--fg3); }
  #list { flex: 1; overflow: auto; margin: 0 -4px; padding: 0 4px; }
  .row { all: unset; display: block; box-sizing: border-box; width: 100%; padding: 9px 10px; border-radius: 8px; cursor: pointer; }
  .row:hover { background: var(--sel); }
  .row.on { background: rgba(10,132,255,.16); }
  .row b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row small { display: block; margin-top: 3px; font-size: 11px; color: var(--fg3); }
  .row span { display: block; margin-top: 3px; font-size: 12px; color: var(--fg2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 34px 28px 16px; box-sizing: border-box; }
  #empty { margin: auto; text-align: center; color: var(--fg3); line-height: 1.6; }
  #detail { display: flex; flex-direction: column; min-height: 0; flex: 1; }
  #title { font-size: 22px; font-weight: 700; margin: 0; padding: 2px 4px; border-radius: 6px; outline: none; -webkit-user-select: text; cursor: text; }
  #title:focus { box-shadow: 0 0 0 3px rgba(10,132,255,.35); }
  #meta { color: var(--fg3); font-size: 12px; margin: 4px 4px 12px; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button.b { font: 12px system-ui; color: var(--fg); background: var(--ctl); border: 0; border-radius: 7px; padding: 5px 11px; box-shadow: inset 0 0 0 .5px var(--line), 0 1px 1px rgba(0,0,0,.05); cursor: pointer; }
  button.b:hover { filter: brightness(.97); }
  button.b.red { color: var(--danger); }
  button.b.blue { background: var(--accent); color: #fff; box-shadow: none; }
  button.b:disabled { opacity: .5; cursor: default; }
  nav { display: flex; gap: 2px; background: var(--sel); border-radius: 8px; padding: 2px; margin: 14px 0 12px; align-self: flex-start; }
  nav button { all: unset; padding: 4px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; color: var(--fg2); }
  nav button[aria-selected=true] { background: var(--card); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .pane { flex: 1; overflow: auto; min-height: 0; -webkit-user-select: text; cursor: auto; padding-right: 6px; }
  .pane[hidden] { display: none; }
  h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--fg3); margin: 18px 0 6px; }
  h3:first-child { margin-top: 0; }
  .box { background: var(--card); border-radius: 10px; padding: 12px 14px; box-shadow: 0 0 0 .5px var(--line); line-height: 1.5; white-space: pre-wrap; }
  .md { white-space: normal; }
  .md p { margin: 0 0 8px; } .md ul { margin: 0 0 8px; padding-left: 18px; } .md h4 { margin: 10px 0 4px; font-size: 13px; }
  .line { display: grid; grid-template-columns: 64px 1fr; gap: 10px; padding: 6px 4px; border-radius: 6px; }
  .line:hover { background: var(--sel); }
  .line time { color: var(--fg3); font-size: 11px; font-variant-numeric: tabular-nums; padding-top: 2px; }
  .line b { font-size: 12px; display: block; margin-bottom: 1px; }
  .line mark { background: rgba(255,214,10,.4); color: inherit; border-radius: 2px; }
  #tfind { height: 28px; padding: 0 10px; width: 260px; margin-bottom: 8px; }
  #chat { display: flex; flex-direction: column; gap: 10px; padding-bottom: 8px; }
  .msg { max-width: 85%; padding: 9px 12px; border-radius: 12px; line-height: 1.45; }
  .msg.me { align-self: flex-end; background: var(--accent); color: #fff; white-space: pre-wrap; }
  .msg.ai { align-self: flex-start; background: var(--card); box-shadow: 0 0 0 .5px var(--line); }
  .msg.wait { color: var(--fg3); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 10px; }
  #askform { display: flex; gap: 8px; padding-top: 10px; }
  #askq { flex: 1; resize: none; height: 38px; padding: 9px 12px; box-sizing: border-box; }
  #notice { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: rgba(40,40,42,.92); color: #fff; padding: 8px 14px; border-radius: 10px; font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #notice.on { opacity: 1; }
</style></head>
<body>
<aside>
  <h1>Riunioni</h1>
  <input id="q" type="search" placeholder="Cerca titoli e trascrizioni" autocomplete="off" aria-label="Cerca riunioni">
  <div id="count">Caricamento…</div>
  <div id="list" role="list"></div>
  <div class="bar" style="margin-top:10px"><button class="b" id="live">● Nuova riunione</button></div>
</aside>
<main>
  <div id="empty">Seleziona una riunione.<br>Le riunioni registrate con Meeting Copilot compaiono qui.</div>
  <div id="detail" hidden>
    <div class="bar" style="justify-content:space-between">
      <h2 id="title" contenteditable="plaintext-only" spellcheck="false" title="Clicca per rinominare"></h2>
      <div class="bar"><button class="b" id="copy">Copia</button><button class="b" id="export">Esporta .md</button><button class="b red" id="delete">Elimina</button></div>
    </div>
    <div id="meta"></div>
    <nav role="tablist"><button data-t="minute" aria-selected="true">Minute</button><button data-t="note">Note</button><button data-t="trascrizione">Trascrizione</button><button data-t="chiedi">Chiedi</button></nav>
    <section class="pane" id="p-minute">
      <h3>Riepilogo</h3><div class="box" id="summary"></div>
      <div id="actblock"><h3>Azioni</h3><div class="box" id="actions"></div></div>
      <div id="ansblock"><h3>Risposte del Copilot</h3><div class="box" id="answers"></div></div>
      <div class="bar" style="margin-top:14px"><button class="b" id="regen">Rigenera minute</button></div>
    </section>
    <section class="pane" id="p-note" hidden>
      <div id="liveblock"><h3>Note live</h3><div class="box" id="livenotes"></div></div>
      <div id="noteblock"><h3>Note e contesto</h3><div class="box" id="notes"></div></div>
      <div id="nonotes" class="box" style="color:var(--fg3)">Nessuna nota per questa riunione.</div>
    </section>
    <section class="pane" id="p-trascrizione" hidden>
      <input id="tfind" type="search" placeholder="Trova nella trascrizione" autocomplete="off">
      <div id="speakers" class="chips"></div>
      <div id="transcript"></div>
    </section>
    <section class="pane" id="p-chiedi" hidden style="display:flex;flex-direction:column">
      <div class="chips" id="sugg"></div>
      <div id="chat"></div>
    </section>
    <form id="askform" hidden><textarea id="askq" placeholder="Chiedi qualcosa su questa riunione…" aria-label="Domanda"></textarea><button class="b blue" id="askbtn">Chiedi</button></form>
  </div>
</main>
<div id="notice" role="status"></div>
<script>
const $ = id => document.getElementById(id);
const post = m => window.webkit?.messageHandlers.lib.postMessage(m);
let meetings = [], current = null, markdown = '', tab = 'minute', chats = {}, asking = false, qTimer, noticeTimer;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const when = s => new Date(s * 1000).toLocaleString('it-IT', {weekday:'short', day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'});
const dur = s => s < 60 ? `${Math.floor(s)} s` : s < 3600 ? `${Math.floor(s / 60)} min` : `${Math.floor(s / 3600)} h ${Math.floor(s / 60) % 60} min`;
const hms = s => [Math.floor(s / 3600), Math.floor(s / 60) % 60, Math.floor(s) % 60].map(n => String(n).padStart(2, '0')).join(':');
const status = s => s === 'Ended' ? 'Conclusa' : s === 'Interrupted or listening' ? 'In corso o interrotta' : s;
function md(text) {   // just enough Markdown for answers and minutes: headings, bullets, bold
  const out = []; let list = false;
  for (const raw of String(text || '').split('\n')) {
    const line = esc(raw).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    const bullet = line.match(/^\s*[-•*]\s+(.*)/), head = line.match(/^#{1,4}\s+(.*)/);
    if (bullet) { if (!list) { out.push('<ul>'); list = true } out.push(`<li>${bullet[1]}</li>`); continue }
    if (list) { out.push('</ul>'); list = false }
    if (head) out.push(`<h4>${head[1]}</h4>`); else if (line.trim()) out.push(`<p>${line}</p>`);
  }
  if (list) out.push('</ul>');
  return out.join('');
}
function notice(t) { $('notice').textContent = t; $('notice').classList.add('on'); clearTimeout(noticeTimer); noticeTimer = setTimeout(() => $('notice').classList.remove('on'), 2400) }
function paintList() {
  const q = $('q').value.trim();
  $('count').textContent = `${meetings.length} riunion${meetings.length === 1 ? 'e' : 'i'}${q ? ' trovate' : ''}`;
  $('list').replaceChildren(...meetings.map(m => {
    const b = document.createElement('button'); b.className = 'row' + (current?.id === m.id ? ' on' : ''); b.setAttribute('role', 'listitem');
    b.innerHTML = `<b>${esc(m.title)}</b><small>${esc([when(m.started), dur(m.duration), m.app].filter(Boolean).join(' · '))}</small><span>${esc((m.summary || '').split('\n')[0] || status(m.status))}</span>`;
    b.onclick = () => open(m.id); return b;
  }));
}
function open(id) { post({do: 'get', id}); }
function show(t) {
  tab = t;
  for (const b of document.querySelectorAll('nav button')) b.setAttribute('aria-selected', String(b.dataset.t === t));
  for (const p of document.querySelectorAll('.pane')) p.hidden = p.id !== 'p-' + t;
  $('askform').hidden = t !== 'chiedi';
  if (t === 'chiedi') { $('askq').focus(); paintChat() }
}
function paintMeeting(m, md_) {
  current = m; markdown = md_ || '';
  $('empty').hidden = true; $('detail').hidden = false;
  $('title').textContent = m.title;
  const people = [...new Set((m.transcript || []).map(r => r.speaker || 'Them'))];
  $('meta').textContent = [when(m.started), dur(m.duration), m.app, status(m.status), people.length ? people.join(', ') : ''].filter(Boolean).join(' · ');
  $('summary').className = 'box md'; $('summary').innerHTML = m.summary ? md(m.summary) : '<span style="color:var(--fg3)">Minute non ancora disponibili. Premi “Rigenera minute”.</span>';
  $('actblock').hidden = !m.action_items?.length; $('actions').className = 'box md'; $('actions').innerHTML = md((m.action_items || []).map(a => '- ' + a).join('\n'));
  $('ansblock').hidden = !m.answers?.length; $('answers').textContent = (m.answers || []).map(r => (r.question || '') + '\n' + (r.lines || []).join('\n')).join('\n\n');
  $('liveblock').hidden = !m.live_notes; $('livenotes').className = 'box md'; $('livenotes').innerHTML = md(m.live_notes);
  $('noteblock').hidden = !m.notes; $('notes').textContent = m.notes || '';
  $('nonotes').hidden = !!(m.live_notes || m.notes);
  $('regen').disabled = false; $('regen').textContent = 'Rigenera minute';
  paintSpeakers(people); paintTranscript(); paintList();
  $('sugg').replaceChildren(...['Riassumi le decisioni prese', 'Chi deve fare cosa e entro quando?', 'Quali punti sono rimasti aperti?', 'Scrivi una mail di follow-up'].map(t => {
    const b = document.createElement('button'); b.className = 'b'; b.textContent = t; b.onclick = () => ask(t); return b;
  }));
  if (tab === 'chiedi') paintChat();
}
let speakerFilter = null;
function paintSpeakers(people) {
  speakerFilter = null;
  $('speakers').replaceChildren(...(people.length > 1 ? ['Tutti', ...people] : []).map(p => {
    const b = document.createElement('button'); b.className = 'b'; b.textContent = p; b.dataset.p = p;
    b.onclick = () => { speakerFilter = p === 'Tutti' ? null : p; for (const c of $('speakers').children) c.classList.toggle('blue', c === b); paintTranscript() };
    if (p === 'Tutti') b.classList.add('blue'); return b;
  }));
}
const hue = name => [...name].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);
function paintTranscript() {
  const find = $('tfind').value.trim().toLowerCase(), rows = (current?.transcript || []).filter(r => (!speakerFilter || (r.speaker || 'Them') === speakerFilter) && (!find || r.text.toLowerCase().includes(find)));
  const re = find ? new RegExp(find.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi') : null;
  $('transcript').innerHTML = rows.length ? rows.map(r => {
    const who = r.speaker || 'Them', color = who === 'You' ? 'var(--accent)' : `hsl(${hue(who)} 55% 50%)`;
    const text = re ? esc(r.text).replace(re, m => `<mark>${m}</mark>`) : esc(r.text);
    return `<div class="line"><time>${hms(r.seconds || 0)}</time><div><b style="color:${color}">${esc(who === 'You' ? 'Tu' : who)}${r.recovered ? ' · incompleto' : ''}</b>${text}</div></div>`;
  }).join('') : '<div style="color:var(--fg3);padding:8px">Nessuna frase.</div>';
}
function paintChat() {
  const list = chats[current?.id] || [];
  $('sugg').hidden = list.length > 0;
  $('chat').innerHTML = list.map(r => r.role === 'user' ? `<div class="msg me">${esc(r.text)}</div>` : `<div class="msg ai md${r.wait ? ' wait' : ''}">${r.wait ? 'Sto leggendo la riunione…' : md(r.text)}</div>`).join('');
  $('p-chiedi').scrollTop = $('p-chiedi').scrollHeight;
}
function ask(text) {
  const question = (text ?? $('askq').value).trim();
  if (!question || !current || asking) return;
  const list = chats[current.id] = chats[current.id] || [];
  const history = list.filter(r => !r.wait).slice(-8);
  list.push({role: 'user', text: question}, {role: 'ai', wait: true});
  asking = true; $('askbtn').disabled = true; $('askq').value = ''; show('chiedi');
  post({do: 'ask', id: current.id, question, history});
}
window.lib = {
  list(r) { if (r.error) { notice('Non riesco ad aprire le riunioni.'); return } meetings = r.meetings || []; paintList(); if (!current && meetings[0]) open(meetings[0].id) },
  meeting(r) { if (r.error) { notice('Operazione non riuscita.'); $('regen').disabled = false; return } if (r.meeting) paintMeeting(r.meeting, r.markdown) },
  updated(r) { if (r.meeting && current?.id === r.meeting.id) paintMeeting(r.meeting, r.markdown) },
  select(id) { open(id) },
  deleted(id) { if (current?.id === id) { current = null; $('detail').hidden = true; $('empty').hidden = false } post({do: 'list', query: $('q').value.trim()}) },
  answer(r) {
    asking = false; $('askbtn').disabled = false;
    const list = chats[r.id || current?.id] || [], last = list[list.length - 1];
    if (last?.wait) { last.wait = false; last.text = r.answer || 'Non sono riuscito a rispondere. Riprova.' }
    if (current?.id === r.id || !r.id) paintChat();
  },
  notice,
};
$('q').oninput = () => { clearTimeout(qTimer); qTimer = setTimeout(() => post({do: 'list', query: $('q').value.trim()}), 160) };
$('tfind').oninput = paintTranscript;
for (const b of document.querySelectorAll('nav button')) b.onclick = () => show(b.dataset.t);
$('copy').onclick = () => { post({do: 'copy', text: markdown}); notice('Copiata negli appunti.') };
$('export').onclick = () => current && post({do: 'export', id: current.id});
$('delete').onclick = () => current && post({do: 'delete', id: current.id});
$('regen').onclick = () => { if (!current) return; $('regen').disabled = true; $('regen').textContent = 'Rigenero…'; post({do: 'resummarize', id: current.id}) };
$('live').onclick = () => post({do: 'live'});
$('askform').onsubmit = e => { e.preventDefault(); ask() };
$('askq').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask() } };
$('title').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $('title').blur() } if (e.key === 'Escape') { $('title').textContent = current?.title || ''; $('title').blur() } };
$('title').onblur = () => { const t = $('title').textContent.trim(); if (current && t && t !== current.title) post({do: 'rename', id: current.id, title: t}); else if (current) $('title').textContent = current.title };
document.addEventListener('keydown', e => { if (e.metaKey && e.key.toLowerCase() === 'f') { e.preventDefault(); (tab === 'trascrizione' ? $('tfind') : $('q')).focus() } });
post({do: 'ready'});
</script>
</body></html>
